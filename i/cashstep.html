<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14161a;--muted:#5c6370;--line:#e3e6ea;--accent:#c45bc2;--btn:#1f6feb;--btn-ink:#fff}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:420px;margin:0 auto;padding:32px 16px 48px;text-align:center}
.hero{width:100%;height:auto;border-radius:16px;display:block;margin:0 0 20px;aspect-ratio:1200/630}
h1{font-size:22px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 16px;margin-bottom:16px}
.label{color:var(--muted);font-size:14px;margin:0 0 6px}
.code{font:700 36px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:4px;user-select:all;-webkit-user-select:all;word-break:break-all;margin:0;color:var(--ink)}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;font:700 16px/1.3 inherit;text-decoration:none;margin:10px 0;border:1px solid var(--btn);background:transparent;color:var(--btn);cursor:pointer;font-family:inherit}
.primary{background:var(--btn);color:var(--btn-ink)}
.small{display:inline-block;width:auto;padding:8px 18px;margin:12px 0 0;font-size:14px}
.hint{color:var(--muted);font-size:14px;margin:14px 0 0}
#msg{min-height:1.5em;font-size:14px;margin:8px 0 0;color:var(--muted)}
#moving{color:var(--muted);font-size:14px;margin:0 0 8px;min-height:1.2em}
[hidden]{display:none!important}
</style>
